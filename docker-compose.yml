name: fida-ride

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fida-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fida_ride}
      POSTGRES_USER: ${POSTGRES_USER:-fida_ride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: fida-ride-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly no
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --timeout 0
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  go-telemetry-service:
    build:
      context: ./services/go-telemetry-service
      dockerfile: Dockerfile
    image: fida-ride/go-telemetry-service:local
    container_name: fida-ride-go-telemetry
    restart: unless-stopped
    init: true
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_DB: ${TELEMETRY_REDIS_DB:-0}
      REDIS_POOL_SIZE: ${TELEMETRY_REDIS_POOL_SIZE:-256}
      REDIS_MIN_IDLE_CONNS: ${TELEMETRY_REDIS_MIN_IDLE_CONNS:-64}
      DRIVER_PRESENCE_TTL: ${DRIVER_PRESENCE_TTL:-20s}
      STALE_CLEANUP_INTERVAL: ${STALE_CLEANUP_INTERVAL:-5s}
      STALE_CLEANUP_BATCH_SIZE: ${STALE_CLEANUP_BATCH_SIZE:-5000}
      WS_IDLE_TIMEOUT: ${WS_IDLE_TIMEOUT:-60s}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25s}
      ALLOW_INSECURE_DRIVER_ID: ${TELEMETRY_ALLOW_INSECURE_DRIVER_ID:-true}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:?JWT_HS256_SECRET must be set in .env}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
      TELEMETRY_SIGNATURE_MAX_CLOCK_SKEW: ${TELEMETRY_SIGNATURE_MAX_CLOCK_SKEW:-30s}
      TELEMETRY_SIGNATURE_REDIS_TIMEOUT: ${TELEMETRY_SIGNATURE_REDIS_TIMEOUT:-250ms}
      TELEMETRY_SEQUENCE_TTL: ${TELEMETRY_SEQUENCE_TTL:-20m}
      TELEMETRY_MAX_SPEED_KPH: ${TELEMETRY_MAX_SPEED_KPH:-160}
      TELEMETRY_VELOCITY_MIN_WINDOW: ${TELEMETRY_VELOCITY_MIN_WINDOW:-2s}
      TELEMETRY_VELOCITY_MAX_WINDOW: ${TELEMETRY_VELOCITY_MAX_WINDOW:-90s}
      TELEMETRY_FRAUD_STATE_TTL: ${TELEMETRY_FRAUD_STATE_TTL:-15m}
      TELEMETRY_FRAUD_REDIS_TIMEOUT: ${TELEMETRY_FRAUD_REDIS_TIMEOUT:-250ms}
      TELEMETRY_FRAUD_BUDGET: ${TELEMETRY_FRAUD_BUDGET:-2ms}
    ports:
      - "127.0.0.1:${GO_TELEMETRY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nestjs-core-api:
    build:
      context: ./services/nestjs-core-api
      dockerfile: Dockerfile
    image: fida-ride/nestjs-core-api:local
    container_name: fida-ride-nestjs-core
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fida_ride}
      DB_USER: ${POSTGRES_USER:-fida_ride}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      CORE_REDIS_DB: ${CORE_REDIS_DB:-0}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:?JWT_HS256_SECRET must be set in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      TELEMETRY_SESSION_TTL_SECONDS: ${TELEMETRY_SESSION_TTL_SECONDS:-900}
      ATTESTATION_ENFORCEMENT_ENABLED: ${ATTESTATION_ENFORCEMENT_ENABLED:-false}
      ATTESTATION_CHALLENGE_TTL_SECONDS: ${ATTESTATION_CHALLENGE_TTL_SECONDS:-120}
      ATTESTATION_TICKET_TTL_SECONDS: ${ATTESTATION_TICKET_TTL_SECONDS:-90}
      ATTESTATION_PROVIDER_TIMEOUT_MS: ${ATTESTATION_PROVIDER_TIMEOUT_MS:-8000}
      PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON: ${PLAY_INTEGRITY_SERVICE_ACCOUNT_JSON:-}
      ANDROID_RIDER_PACKAGE_NAME: ${ANDROID_RIDER_PACKAGE_NAME:-com.fidalix.fida_rider}
      ANDROID_DRIVER_PACKAGE_NAME: ${ANDROID_DRIVER_PACKAGE_NAME:-com.fidalix.fida_driver}
      PLAY_INTEGRITY_MAX_AGE_MS: ${PLAY_INTEGRITY_MAX_AGE_MS:-120000}
      PLAY_INTEGRITY_REQUIRE_LICENSED: ${PLAY_INTEGRITY_REQUIRE_LICENSED:-true}
      PLAY_INTEGRITY_REQUIRE_STRONG: ${PLAY_INTEGRITY_REQUIRE_STRONG:-false}
      APPLE_APP_ATTEST_TEAM_ID: ${APPLE_APP_ATTEST_TEAM_ID:-}
      APPLE_RIDER_BUNDLE_ID: ${APPLE_RIDER_BUNDLE_ID:-com.fidalix.fida_rider}
      APPLE_DRIVER_BUNDLE_ID: ${APPLE_DRIVER_BUNDLE_ID:-com.fidalix.fida_driver}
      APPLE_APP_ATTEST_ALLOW_DEVELOPMENT: ${APPLE_APP_ATTEST_ALLOW_DEVELOPMENT:-false}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET must be set in .env}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-true}
      OTP_DELIVERY_URL: ${OTP_DELIVERY_URL:-}
      OTP_DELIVERY_TOKEN: ${OTP_DELIVERY_TOKEN:-}
      RIDE_BASE_FARE_RWF: ${RIDE_BASE_FARE_RWF:-1000}
      RIDE_PER_KM_RWF: ${RIDE_PER_KM_RWF:-500}
      DISPATCH_RADIUS_KM: ${DISPATCH_RADIUS_KM:-5}
      DISPATCH_CANDIDATE_LIMIT: ${DISPATCH_CANDIDATE_LIMIT:-100}
      BIDDING_TTL_SECONDS: ${BIDDING_TTL_SECONDS:-120}
      BIDDING_ACCEPT_LOCK_TTL_MS: ${BIDDING_ACCEPT_LOCK_TTL_MS:-10000}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-0.15}
      DRIVER_NEGATIVE_CREDIT_LIMIT: ${DRIVER_NEGATIVE_CREDIT_LIMIT:-15000}
      DRIVER_FINANCIAL_BLOCK_TTL_SECONDS: ${DRIVER_FINANCIAL_BLOCK_TTL_SECONDS:-86400}
      WALLET_SETTLEMENT_POLL_MS: ${WALLET_SETTLEMENT_POLL_MS:-500}
      WALLET_SETTLEMENT_BATCH_SIZE: ${WALLET_SETTLEMENT_BATCH_SIZE:-10}
      WALLET_SETTLEMENT_LEASE_SECONDS: ${WALLET_SETTLEMENT_LEASE_SECONDS:-120}
      WALLET_SETTLEMENT_MAX_ATTEMPTS: ${WALLET_SETTLEMENT_MAX_ATTEMPTS:-20}
      FRAUD_DETECTION_ENABLED: ${FRAUD_DETECTION_ENABLED:-false}
      FRAUD_DEVICE_HMAC_SECRET: ${FRAUD_DEVICE_HMAC_SECRET:-}
      FRAUD_RISK_WINDOW_SECONDS: ${FRAUD_RISK_WINDOW_SECONDS:-900}
      FRAUD_DEVICE_BIND_TTL_SECONDS: ${FRAUD_DEVICE_BIND_TTL_SECONDS:-120}
      FRAUD_DEVICE_CLOCK_SKEW_MS: ${FRAUD_DEVICE_CLOCK_SKEW_MS:-300000}
      FRAUD_ACCOUNT_STATE_CACHE_SECONDS: ${FRAUD_ACCOUNT_STATE_CACHE_SECONDS:-60}
      FRAUD_BLOCK_CACHE_TTL_SECONDS: ${FRAUD_BLOCK_CACHE_TTL_SECONDS:-86400}
      FRAUD_FLAG_THRESHOLD: ${FRAUD_FLAG_THRESHOLD:-70}
      FRAUD_SUSPEND_THRESHOLD: ${FRAUD_SUSPEND_THRESHOLD:-90}
      FRAUD_WEIGHT_DEVICE_PARALLEL_ACCOUNT: ${FRAUD_WEIGHT_DEVICE_PARALLEL_ACCOUNT:-45}
      FRAUD_WEIGHT_DEVICE_CLOCK_SKEW: ${FRAUD_WEIGHT_DEVICE_CLOCK_SKEW:-20}
      FRAUD_WEIGHT_INVALID_DEVICE_TIMESTAMP: ${FRAUD_WEIGHT_INVALID_DEVICE_TIMESTAMP:-15}
      FRAUD_WEIGHT_MOCK_LOCATION: ${FRAUD_WEIGHT_MOCK_LOCATION:-70}
      FRAUD_WEIGHT_VELOCITY_JUMP: ${FRAUD_WEIGHT_VELOCITY_JUMP:-50}
      SURGE_PRICING_ENABLED: ${SURGE_PRICING_ENABLED:-false}
      SURGE_REFRESH_INTERVAL_MS: ${SURGE_REFRESH_INTERVAL_MS:-10000}
      SURGE_REFRESH_LOCK_TTL_MS: ${SURGE_REFRESH_LOCK_TTL_MS:-30000}
      SURGE_CACHE_TTL_SECONDS: ${SURGE_CACHE_TTL_SECONDS:-45}
      SURGE_DEMAND_WINDOW_SECONDS: ${SURGE_DEMAND_WINDOW_SECONDS:-600}
      SURGE_RATIO_THRESHOLD: ${SURGE_RATIO_THRESHOLD:-1.5}
      SURGE_START_MULTIPLIER: ${SURGE_START_MULTIPLIER:-1.2}
      SURGE_MAX_MULTIPLIER: ${SURGE_MAX_MULTIPLIER:-3.0}
      SURGE_PROGRESSIVE_SLOPE: ${SURGE_PROGRESSIVE_SLOPE:-0.4}
      SURGE_DRIVER_PREFILTER_LIMIT: ${SURGE_DRIVER_PREFILTER_LIMIT:-20000}
      SURGE_DB_STATEMENT_TIMEOUT_MS: ${SURGE_DB_STATEMENT_TIMEOUT_MS:-1500}
      SURGE_DB_LOCK_TIMEOUT_MS: ${SURGE_DB_LOCK_TIMEOUT_MS:-100}
      SURGE_DB_IDLE_TX_TIMEOUT_MS: ${SURGE_DB_IDLE_TX_TIMEOUT_MS:-3000}
      WHATSAPP_BOT_ENABLED: ${WHATSAPP_BOT_ENABLED:-false}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_ALLOW_LEGACY_SHA1: ${WHATSAPP_ALLOW_LEGACY_SHA1:-false}
      WHATSAPP_OUTBOUND_TIMEOUT_MS: ${WHATSAPP_OUTBOUND_TIMEOUT_MS:-8000}
      WHATSAPP_WORKER_POLL_MS: ${WHATSAPP_WORKER_POLL_MS:-500}
      WHATSAPP_WORKER_BATCH_SIZE: ${WHATSAPP_WORKER_BATCH_SIZE:-10}
      WHATSAPP_WORKER_MAX_ATTEMPTS: ${WHATSAPP_WORKER_MAX_ATTEMPTS:-5}
      WHATSAPP_PROCESSING_LEASE_SECONDS: ${WHATSAPP_PROCESSING_LEASE_SECONDS:-120}
      WHATSAPP_SESSION_TTL_SECONDS: ${WHATSAPP_SESSION_TTL_SECONDS:-1800}
      WHATSAPP_BOOKING_MIN_CONFIDENCE: ${WHATSAPP_BOOKING_MIN_CONFIDENCE:-0.85}
      WHATSAPP_BOOKING_LLM_ENABLED: ${WHATSAPP_BOOKING_LLM_ENABLED:-false}
      WHATSAPP_BOOKING_LLM_MODEL: ${WHATSAPP_BOOKING_LLM_MODEL:-}
      WHATSAPP_BOOKING_LLM_TIMEOUT_MS: ${WHATSAPP_BOOKING_LLM_TIMEOUT_MS:-6000}
      WHATSAPP_BOOKING_LLM_BYPASS_CONFIDENCE: ${WHATSAPP_BOOKING_LLM_BYPASS_CONFIDENCE:-0.92}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
      GOOGLE_GEOCODING_REGION: ${GOOGLE_GEOCODING_REGION:-rw}
      GOOGLE_GEOCODING_COUNTRY: ${GOOGLE_GEOCODING_COUNTRY:-RW}
      GOOGLE_GEOCODING_BOUNDS: ${GOOGLE_GEOCODING_BOUNDS:-}
      GOOGLE_GEOCODING_TIMEOUT_MS: ${GOOGLE_GEOCODING_TIMEOUT_MS:-5000}
      GOOGLE_GEOCODING_MIN_CONFIDENCE: ${GOOGLE_GEOCODING_MIN_CONFIDENCE:-0.82}
    ports:
      - "127.0.0.1:${NESTJS_CORE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:3000/api/v1/healthz | grep -q ''"status":"ok"'''
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fida-ride-network:
    name: fida-ride-local
    driver: bridge
