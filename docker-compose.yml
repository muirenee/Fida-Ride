name: fida-ride

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fida-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fida_ride}
      POSTGRES_USER: ${POSTGRES_USER:-fida_ride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: fida-ride-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly no
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --timeout 0
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  go-telemetry-service:
    build:
      context: ./services/go-telemetry-service
      dockerfile: Dockerfile
    image: fida-ride/go-telemetry-service:local
    container_name: fida-ride-go-telemetry
    restart: unless-stopped
    init: true
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_DB: ${TELEMETRY_REDIS_DB:-0}
      DRIVER_PRESENCE_TTL: ${DRIVER_PRESENCE_TTL:-20s}
      STALE_CLEANUP_INTERVAL: ${STALE_CLEANUP_INTERVAL:-5s}
      STALE_CLEANUP_BATCH_SIZE: ${STALE_CLEANUP_BATCH_SIZE:-5000}
      WS_IDLE_TIMEOUT: ${WS_IDLE_TIMEOUT:-60s}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25s}
      ALLOW_INSECURE_DRIVER_ID: ${TELEMETRY_ALLOW_INSECURE_DRIVER_ID:-true}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:-}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${GO_TELEMETRY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:8080/healthz | grep -q ''"status":"ok"'''
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nestjs-core-api:
    image: busybox:1.36.1
    container_name: fida-ride-nestjs-core
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        mkdir -p /www &&
        printf '%s\n' '{"service":"nestjs-core-api","status":"stub"}' > /www/index.html &&
        exec httpd -f -p 3000 -h /www
    ports:
      - "127.0.0.1:${NESTJS_CORE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fida-ride-network:
    name: fida-ride-local
    driver: bridge
