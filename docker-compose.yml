name: fida-ride

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: fida-ride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fida_ride}
      POSTGRES_USER: ${POSTGRES_USER:-fida_ride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/001-init-db.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" || exit 1'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 256mb
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: fida-ride-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-512mb}
    command:
      - /bin/sh
      - -c
      - >-
        exec redis-server
        --save ""
        --appendonly no
        --requirepass "$${REDIS_PASSWORD}"
        --maxmemory "$${REDIS_MAXMEMORY}"
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --timeout 0
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  go-telemetry-service:
    build:
      context: ./services/go-telemetry-service
      dockerfile: Dockerfile
    image: fida-ride/go-telemetry-service:local
    container_name: fida-ride-go-telemetry
    restart: unless-stopped
    init: true
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_DB: ${TELEMETRY_REDIS_DB:-0}
      DRIVER_PRESENCE_TTL: ${DRIVER_PRESENCE_TTL:-20s}
      STALE_CLEANUP_INTERVAL: ${STALE_CLEANUP_INTERVAL:-5s}
      STALE_CLEANUP_BATCH_SIZE: ${STALE_CLEANUP_BATCH_SIZE:-5000}
      WS_IDLE_TIMEOUT: ${WS_IDLE_TIMEOUT:-60s}
      WS_PING_INTERVAL: ${WS_PING_INTERVAL:-25s}
      ALLOW_INSECURE_DRIVER_ID: ${TELEMETRY_ALLOW_INSECURE_DRIVER_ID:-true}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:?JWT_HS256_SECRET must be set in .env}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${GO_TELEMETRY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1'
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nestjs-core-api:
    build:
      context: ./services/nestjs-core-api
      dockerfile: Dockerfile
    image: fida-ride/nestjs-core-api:local
    container_name: fida-ride-nestjs-core
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-fida_ride}
      DB_USER: ${POSTGRES_USER:-fida_ride}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT_INTERNAL: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      CORE_REDIS_DB: ${CORE_REDIS_DB:-0}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:?JWT_HS256_SECRET must be set in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET must be set in .env}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_DEV_ECHO: ${OTP_DEV_ECHO:-true}
      OTP_DELIVERY_URL: ${OTP_DELIVERY_URL:-}
      OTP_DELIVERY_TOKEN: ${OTP_DELIVERY_TOKEN:-}
      RIDE_BASE_FARE_RWF: ${RIDE_BASE_FARE_RWF:-1000}
      RIDE_PER_KM_RWF: ${RIDE_PER_KM_RWF:-500}
      DISPATCH_RADIUS_KM: ${DISPATCH_RADIUS_KM:-5}
      DISPATCH_CANDIDATE_LIMIT: ${DISPATCH_CANDIDATE_LIMIT:-100}
      BIDDING_TTL_SECONDS: ${BIDDING_TTL_SECONDS:-120}
      BIDDING_ACCEPT_LOCK_TTL_MS: ${BIDDING_ACCEPT_LOCK_TTL_MS:-10000}
      SURGE_PRICING_ENABLED: ${SURGE_PRICING_ENABLED:-false}
      SURGE_REFRESH_INTERVAL_MS: ${SURGE_REFRESH_INTERVAL_MS:-10000}
      SURGE_REFRESH_LOCK_TTL_MS: ${SURGE_REFRESH_LOCK_TTL_MS:-30000}
      SURGE_CACHE_TTL_SECONDS: ${SURGE_CACHE_TTL_SECONDS:-45}
      SURGE_DEMAND_WINDOW_SECONDS: ${SURGE_DEMAND_WINDOW_SECONDS:-600}
      SURGE_RATIO_THRESHOLD: ${SURGE_RATIO_THRESHOLD:-1.5}
      SURGE_START_MULTIPLIER: ${SURGE_START_MULTIPLIER:-1.2}
      SURGE_MAX_MULTIPLIER: ${SURGE_MAX_MULTIPLIER:-3.0}
      SURGE_PROGRESSIVE_SLOPE: ${SURGE_PROGRESSIVE_SLOPE:-0.4}
      SURGE_DRIVER_PREFILTER_LIMIT: ${SURGE_DRIVER_PREFILTER_LIMIT:-20000}
      SURGE_DB_STATEMENT_TIMEOUT_MS: ${SURGE_DB_STATEMENT_TIMEOUT_MS:-1500}
      SURGE_DB_LOCK_TIMEOUT_MS: ${SURGE_DB_LOCK_TIMEOUT_MS:-100}
      SURGE_DB_IDLE_TX_TIMEOUT_MS: ${SURGE_DB_IDLE_TX_TIMEOUT_MS:-3000}
      WHATSAPP_BOT_ENABLED: ${WHATSAPP_BOT_ENABLED:-false}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-}
      WHATSAPP_ALLOW_LEGACY_SHA1: ${WHATSAPP_ALLOW_LEGACY_SHA1:-false}
      WHATSAPP_OUTBOUND_TIMEOUT_MS: ${WHATSAPP_OUTBOUND_TIMEOUT_MS:-8000}
      WHATSAPP_WORKER_POLL_MS: ${WHATSAPP_WORKER_POLL_MS:-500}
      WHATSAPP_WORKER_BATCH_SIZE: ${WHATSAPP_WORKER_BATCH_SIZE:-10}
      WHATSAPP_WORKER_MAX_ATTEMPTS: ${WHATSAPP_WORKER_MAX_ATTEMPTS:-5}
      WHATSAPP_PROCESSING_LEASE_SECONDS: ${WHATSAPP_PROCESSING_LEASE_SECONDS:-120}
      WHATSAPP_SESSION_TTL_SECONDS: ${WHATSAPP_SESSION_TTL_SECONDS:-1800}
      WHATSAPP_BOOKING_MIN_CONFIDENCE: ${WHATSAPP_BOOKING_MIN_CONFIDENCE:-0.85}
      WHATSAPP_BOOKING_LLM_ENABLED: ${WHATSAPP_BOOKING_LLM_ENABLED:-false}
      WHATSAPP_BOOKING_LLM_MODEL: ${WHATSAPP_BOOKING_LLM_MODEL:-}
      WHATSAPP_BOOKING_LLM_TIMEOUT_MS: ${WHATSAPP_BOOKING_LLM_TIMEOUT_MS:-6000}
      WHATSAPP_BOOKING_LLM_BYPASS_CONFIDENCE: ${WHATSAPP_BOOKING_LLM_BYPASS_CONFIDENCE:-0.92}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_GEOCODING_API_KEY: ${GOOGLE_GEOCODING_API_KEY:-}
      GOOGLE_GEOCODING_REGION: ${GOOGLE_GEOCODING_REGION:-rw}
      GOOGLE_GEOCODING_COUNTRY: ${GOOGLE_GEOCODING_COUNTRY:-RW}
      GOOGLE_GEOCODING_BOUNDS: ${GOOGLE_GEOCODING_BOUNDS:-}
      GOOGLE_GEOCODING_TIMEOUT_MS: ${GOOGLE_GEOCODING_TIMEOUT_MS:-5000}
      GOOGLE_GEOCODING_MIN_CONFIDENCE: ${GOOGLE_GEOCODING_MIN_CONFIDENCE:-0.82}
    ports:
      - "127.0.0.1:${NESTJS_CORE_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O - http://127.0.0.1:3000/api/v1/healthz | grep -q ''"status":"ok"'''
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    networks:
      - fida-ride-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fida-ride-network:
    name: fida-ride-local
    driver: bridge
