name: Fida-Ride Admin CI

on:
  push:
    branches:
      - main
      - master
      - development
    paths:
      - 'apps/fida_admin/**'
      - 'services/go-admin-stream-service/**'
      - 'services/nestjs-core-api/src/admin/**'
      - 'database/migrations/schema-v10-admin-operations.sql'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    branches:
      - main
      - master
      - development
    paths:
      - 'apps/fida_admin/**'
      - 'services/go-admin-stream-service/**'
      - 'services/nestjs-core-api/src/admin/**'
      - 'database/migrations/schema-v10-admin-operations.sql'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-ride-admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-stream:
    name: Go admin stream
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: services/go-admin-stream-service/go.sum

      - name: Verify Go module graph
        working-directory: services/go-admin-stream-service
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        working-directory: services/go-admin-stream-service
        shell: bash
        run: |
          set -euo pipefail
          diff="$(gofmt -d .)"
          if [ -n "$diff" ]; then
            printf 'gofmt changes required:\n%s\n' "$diff"
            exit 1
          fi

      - name: Test and vet
        working-directory: services/go-admin-stream-service
        run: |
          go test -v ./...
          go vet ./...

      - name: Build production image
        run: |
          docker build \
            --tag fida-ride/go-admin-stream-service:ci \
            services/go-admin-stream-service

  admin-web:
    name: Next.js admin web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: apps/fida_admin
        run: npm install --no-audit --fund=false

      - name: Typecheck
        working-directory: apps/fida_admin
        run: npm run typecheck

      - name: Build Next.js application
        working-directory: apps/fida_admin
        env:
          CORE_API_INTERNAL_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_ADMIN_STREAM_URL: ws://127.0.0.1:8090/admin/stream
          NEXT_PUBLIC_MAP_STYLE_URL: https://demotiles.maplibre.org/style.json
        run: npm run build

      - name: Build production image
        run: |
          docker build \
            --tag fida-ride/admin-web:ci \
            --build-arg CORE_API_INTERNAL_URL=http://nestjs-core-api:3000 \
            --build-arg NEXT_PUBLIC_ADMIN_STREAM_URL=ws://127.0.0.1:8090/admin/stream \
            apps/fida_admin
