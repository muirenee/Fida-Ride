name: Flutter Format Diff

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format apps packages
          git diff --no-ext-diff --unified=200 -- apps packages
