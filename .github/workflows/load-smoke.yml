name: Fida-Ride Load Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'tools/loadtest/**'
      - '.github/workflows/load-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fida-ride-load-smoke
  cancel-in-progress: true

jobs:
  smoke-load:
    name: Signed telemetry + marketplace smoke load
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: load-postgres-password
      REDIS_PASSWORD: load-redis-password
      LOAD_DRIVER_COUNT: '2000'
      LOAD_RIDER_COUNT: '100'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: true
          cache-dependency-path: tools/loadtest/go.sum

      - name: Validate load harness
        working-directory: tools/loadtest
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify
          gofmt -w .
          go test -run '^$' ./...
          go test -c -o fida-loadtest .

      - name: Generate ephemeral test secrets
        shell: bash
        run: |
          set -euo pipefail
          echo "JWT_HS256_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "OTP_HMAC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Prepare isolated stack environment
        shell: bash
        run: |
          set -euo pipefail
          cat > .env.load <<ENV
          POSTGRES_DB=fida_ride
          POSTGRES_USER=fida_ride
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          REDIS_PASSWORD=$REDIS_PASSWORD
          JWT_HS256_SECRET=$JWT_HS256_SECRET
          OTP_HMAC_SECRET=$OTP_HMAC_SECRET
          NODE_ENV=test
          OTP_DEV_ECHO=true
          ATTESTATION_ENFORCEMENT_ENABLED=false
          FRAUD_DETECTION_ENABLED=false
          SURGE_PRICING_ENABLED=false
          WHATSAPP_BOT_ENABLED=false
          TELEMETRY_ALLOW_INSECURE_DRIVER_ID=false
          TELEMETRY_SESSION_TTL_SECONDS=3600
          BIDDING_TTL_SECONDS=120
          BIDDING_ACCEPT_LOCK_TTL_MS=10000
          DISPATCH_RADIUS_KM=5
          DISPATCH_CANDIDATE_LIMIT=100
          ENV

      - name: Start PostgreSQL and Redis
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.load up -d postgres redis

          for attempt in $(seq 1 60); do
            if docker logs fida-ride-postgres 2>&1 | grep -q 'PostgreSQL init process complete; ready for start up.'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs fida-ride-postgres
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if docker exec fida-ride-postgres pg_isready -U fida_ride -d fida_ride >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs fida-ride-postgres
              exit 1
            fi
            sleep 1
          done

          for attempt in $(seq 1 30); do
            if docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" fida-ride-redis redis-cli ping | grep -q PONG; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs fida-ride-redis
              exit 1
            fi
            sleep 1
          done

      - name: Apply all database migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in database/migrations/schema-v*.sql; do
            echo "Applying $migration"
            docker exec -i fida-ride-postgres sh -lc               'psql -v ON_ERROR_STOP=1 -U fida_ride -d fida_ride' < "$migration"
          done

      - name: Generate and seed load identities
        working-directory: tools/loadtest
        shell: bash
        run: |
          set -euo pipefail
          python3 seed_ci.py

          docker exec -i fida-ride-postgres sh -lc             'psql -q -v ON_ERROR_STOP=1 -U fida_ride -d fida_ride'             < /tmp/fida-load-seed.sql

          docker exec -i             -e REDISCLI_AUTH="$REDIS_PASSWORD"             fida-ride-redis             redis-cli --pipe             < /tmp/fida-load-redis.resp

      - name: Start Fida-Ride backend services
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.load up -d --build             nestjs-core-api             go-telemetry-service

          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/v1/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 90 ]; then
              docker logs fida-ride-nestjs-core
              exit 1
            fi
            sleep 2
          done

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker logs fida-ride-go-telemetry
              exit 1
            fi
            sleep 1
          done

      - name: Run concurrent load
        working-directory: tools/loadtest
        shell: bash
        env:
          FIDA_LOADTEST_ENABLE: '1'
        run: |
          set -euo pipefail
          ulimit -n 65535 || true

          ./fida-loadtest             -test.v             -test.run '^TestLoad$'             -test.timeout=0             -drivers="$LOAD_DRIVER_COUNT"             -riders="$LOAD_RIDER_COUNT"             -duration=90s             -telemetry-interval=3s             -ride-interval=2s             -bids-per-ride=4             -accept-racers=2             -fixtures=fixtures.json             -redis-addr=127.0.0.1:6379             -redis-password="$REDIS_PASSWORD"             2>&1 | tee load-output.log

      - name: Collect database and Redis diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo '=== docker stats ==='
            docker stats --no-stream || true

            if docker inspect fida-ride-postgres >/dev/null 2>&1; then
              echo
              echo '=== PostgreSQL activity ==='
              docker exec fida-ride-postgres psql -U fida_ride -d fida_ride -c                 "SELECT state, count(*) FROM pg_stat_activity WHERE datname='fida_ride' GROUP BY state ORDER BY state;" || true

              echo
              echo '=== trip table statistics ==='
              docker exec fida-ride-postgres psql -U fida_ride -d fida_ride -c                 "SELECT relname, seq_scan, idx_scan, n_tup_ins, n_tup_upd, n_dead_tup FROM pg_stat_user_tables WHERE schemaname='core' AND relname IN ('trips','trip_bids') ORDER BY relname;" || true

              echo
              echo '=== trip index statistics ==='
              docker exec fida-ride-postgres psql -U fida_ride -d fida_ride -c                 "SELECT indexrelname, idx_scan, idx_tup_read, idx_tup_fetch FROM pg_stat_user_indexes WHERE schemaname='core' AND relname='trips' ORDER BY idx_scan DESC;" || true

              echo
              echo '=== trip status counts ==='
              docker exec fida-ride-postgres psql -U fida_ride -d fida_ride -c                 "SELECT status, count(*) FROM core.trips GROUP BY status ORDER BY status;" || true
            fi

            if docker inspect fida-ride-redis >/dev/null 2>&1; then
              echo
              echo '=== Redis stats ==='
              docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" fida-ride-redis                 redis-cli INFO stats || true
              echo
              echo '=== Redis memory ==='
              docker exec -e REDISCLI_AUTH="$REDIS_PASSWORD" fida-ride-redis                 redis-cli INFO memory || true
            fi
          } | tee tools/loadtest/diagnostics.log

          docker logs fida-ride-go-telemetry             > tools/loadtest/go-telemetry.log 2>&1 || true
          docker logs fida-ride-nestjs-core             > tools/loadtest/nestjs-core.log 2>&1 || true

      - name: Upload load-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fida-ride-load-smoke-results
          path: |
            tools/loadtest/load-output.log
            tools/loadtest/diagnostics.log
            tools/loadtest/go-telemetry.log
            tools/loadtest/nestjs-core.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show backend logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs --tail 300 fida-ride-nestjs-core || true
          docker logs --tail 300 fida-ride-go-telemetry || true

      - name: Stop isolated stack
        if: always()
        shell: bash
        run: |
          if [ -f .env.load ]; then
            docker compose --env-file .env.load down -v --remove-orphans || true
          fi
          sudo rm -rf .data || true
