name: Generate NestJS lockfile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-nest-lock.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate package-lock.json
        working-directory: services/nestjs-core-api
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/nestjs-core-api/package-lock.json && \
             git ls-files --error-unmatch services/nestjs-core-api/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/nestjs-core-api/package-lock.json
          git commit -m 'build: lock NestJS dependencies'
          git push origin HEAD:main
