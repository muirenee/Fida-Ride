name: Security Normalize Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-normalize-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Regenerate deterministic NestJS lockfile
        working-directory: services/nestjs-core-api
        run: npm install --package-lock-only --ignore-scripts --no-audit --fund=false

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Apply canonical Dart formatter
        run: dart format apps packages

      - name: Commit normalized generated/style changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/nestjs-core-api/package-lock.json apps packages; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/nestjs-core-api/package-lock.json apps packages
          git commit -m 'chore: finalize mobile security formatting'
          git push origin HEAD:main
